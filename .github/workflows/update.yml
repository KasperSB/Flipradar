name: Opdater boligdata

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent boliger og handler
        continue-on-error: true
        run: python scripts/update.py
      - name: Hent sommerhuse i Nordsjælland
        continue-on-error: true
        run: python scripts/update_ns.py
      - name: Gem de nye data
        run: |
          git config user.name "flipradar-bot"
          git config user.email "flipradar-bot@users.noreply.github.com"
          FILES="listings.json sales.json nordsjaelland.json sales_ns.json"
          mkdir -p /tmp/ny
          for f in $FILES; do [ -f "data/$f" ] && cp "data/$f" /tmp/ny/; done
          # De nye data vinder altid: hent nyeste version af projektet og læg filerne ovenpå
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            for f in $FILES; do [ -f "/tmp/ny/$f" ] && cp "/tmp/ny/$f" data/ && git add "data/$f"; done
            if git diff --cached --quiet; then echo "Intet nyt at gemme"; exit 0; fi
            git commit -m "Opdaterede boligdata $(date -u +%Y-%m-%d_%H%M)"
            if git push origin HEAD:main; then exit 0; fi
            echo "Kunne ikke gemme, prøver igen om 10 sek."
            sleep 10
          done
          exit 1
