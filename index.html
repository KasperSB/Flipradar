<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipradar – boliger til salg i København</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--ink:#18232B;--muted:#5D6B73;--paper:#F5F7F6;--panel:#FFFFFF;--line:#DCE3E1;--patina:#3F7F6E;--patina-soft:#E3EFEB;--good:#2E8B57;--ok:#8DB36B;--neutral:#A3ADB2;--bad:#C2493D;--heart:#C2493D;
font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);font-size:15px;line-height:1.45;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.mtog{display:flex;gap:4px}
.mtog .btn.on{background:#fff;color:var(--ink)}
.count{color:#B9C6C2;font-size:14px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer}
.top .btn{background:transparent;color:#fff;border-color:#3A4A54}
.top .btn.on{background:#fff;color:var(--ink)}
.note{background:#FFF6D9;border-bottom:1px solid #EADBA8;padding:6px 20px;font-size:13px;color:#5B4A12}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);align-items:end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.msel{position:relative;display:flex;flex-direction:column;gap:3px}
.mlabel{font-size:12px;color:var(--muted)}
.dd{border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 8px;background:#fff;text-align:left;min-width:170px;cursor:pointer;position:relative}
.dd::after{content:'';position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.mpanel{position:absolute;top:100%;left:0;margin-top:4px;z-index:900;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(24,35,43,.15);padding:8px;min-width:220px;max-height:340px;overflow:auto}
.mpanel .filters label,.mpanel label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);padding:5px 4px;border-radius:4px;cursor:pointer}
.mpanel label.chk:hover{background:#F2F5F4}
.mpanel .mact{display:flex;gap:6px;padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.mpanel .mact button{font-size:13px;padding:4px 8px}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
.filters input[type=number]{width:120px}
.filters .chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink);padding-bottom:7px}
.main{flex:1;display:grid;grid-template-columns:minmax(380px,540px) 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--line)}
#map{height:100%;min-height:300px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;padding:12px 16px 12px 10px;border-bottom:1px solid var(--line);background:var(--panel);cursor:pointer}
.row:hover{background:#FAFCFB}
.row.sel{box-shadow:inset 3px 0 0 var(--patina)}
.heart{border:0;background:none;font-size:21px;line-height:1;cursor:pointer;color:var(--neutral);padding:2px;align-self:start}
.heart.on{color:var(--heart)}
.addr{font-weight:650}
.price{font-weight:700;text-align:right;white-space:nowrap}
.sub,.nums,.tags{grid-column:2/4}
.nums.sale{font-size:13px;color:var(--muted);gap:4px 12px}
.nums.sale b{color:var(--ink)}
.nums.sale .good b{color:var(--good)}
.nums.sale .bad b{color:var(--bad)}
.sub{color:var(--muted);font-size:13px}
.nums{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--patina-soft);color:#24574A}
.tag.warn{background:#FCEBE8;color:#8E2F25}
.tag.plain{background:#EEF1F2;color:var(--muted)}
.gauge{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.gbar{position:relative;width:90px;height:8px;background:#EDF1F0;border-radius:4px}
.gbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.gfill{position:absolute;top:0;bottom:0;border-radius:4px}
.rank{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:0 6px;margin:0 4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);box-shadow:-8px 0 30px rgba(24,35,43,.18);transform:translateX(105%);transition:transform .22s;z-index:1000;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:start}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 16px;font-size:14px;margin:14px 0}
.facts dt{color:var(--muted);font-size:12px}
.facts dd{margin:0 0 6px;font-weight:600}
h2{font-stretch:112%;font-size:20px;margin:0 0 2px}
h3{font-size:15px;margin:22px 0 8px}
.calc{border:1px solid var(--line);border-radius:8px;padding:12px}
.calc table{width:100%;border-collapse:collapse;font-size:14px}
.calc td{padding:3px 0}
.calc td:last-child{text-align:right}
.calc td:last-child{white-space:nowrap;padding-left:10px}
.calc tr.tot td{border-top:1px solid var(--line);font-weight:700;padding-top:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:#fff;padding:6px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.big{font-size:28px;font-weight:800;font-stretch:115%;margin:8px 0 2px}
.good{color:var(--good)}.bad{color:var(--bad)}
.small{font-size:13px;color:var(--muted)}
textarea,.drawer select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}
textarea{min-height:90px;margin-top:8px}
dialog{border:0;border-radius:10px;max-width:660px;width:calc(100% - 24px);padding:20px;max-height:85vh}
dialog::backdrop{background:rgba(24,35,43,.45)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.grid2 input{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.zrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:14px;border-bottom:1px solid #EEF2F1}
.zrow input{width:60px;border:1px solid var(--line);border-radius:6px;padding:4px}
.viewtog{display:none;gap:6px}
.empty{padding:24px 20px;color:var(--muted)}
.mk-heart{color:var(--heart);font-size:22px;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff}
.zlabel{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;font:700 11px/1.6 "Archivo",sans-serif;padding:0 6px;white-space:nowrap;opacity:.85}
.note.ok{background:var(--patina-soft);border-color:#C9DED7;color:#24574A}
.photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;margin:12px 0 4px;background:#EEF1F2}
.comps{width:100%;border-collapse:collapse;font-size:13px}
.comps th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.comps td{padding:4px 6px 4px 0;border-bottom:1px solid #EEF2F1}
.comps td.r,.comps th.r{text-align:right}
.wrapx{overflow-x:auto}
.mkt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.mkt div{background:#F5F7F6;border-radius:6px;padding:8px}
.mkt b{display:block;font-size:16px}
.mkt span{font-size:12px;color:var(--muted)}
.gone{opacity:.6}
.tag.new{background:var(--ink);color:#fff;font-weight:600}
.tag.fald{background:#FFF1C9;color:#6B5200}
.newbar{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #C9DED7;background:#F0F7F4;color:#24574A;padding:7px 20px;font-size:14px;cursor:pointer}
.newbar b{color:var(--ink)}
.newbar[hidden]{display:none}
#ftog{display:none}
.legend{position:absolute;left:10px;bottom:24px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.7;box-shadow:0 2px 8px rgba(24,35,43,.12)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid #fff}
.legend i.ring{background:#fff;border:3px solid var(--ink);width:13px;height:13px}
#map{position:relative}
.nedb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 2px}
.nedb input{width:110px;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;z-index:2000}
@media (max-width:860px){
 .top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:8px}
 .brand{font-size:19px}.count{display:none}.note,.newbar{padding-left:12px;padding-right:12px}
 .filters{padding:8px 12px;gap:8px}
 #ftog{display:inline-block;align-self:end}
 .filters.collapsed>:not(.keep){display:none}
 .filters.collapsed .keep input{width:100%}
 .filters.collapsed label.keep{flex:1 1 140px}
 .row{padding:10px 12px 10px 6px}
 body.compact .top,body.compact .note,body.compact .newbar{display:none}
 .legend{bottom:30px}
 .main{grid-template-columns:1fr}.viewtog{display:flex}
 .main.show-map .list{display:none}.main:not(.show-map) #map{display:none}
 .facts{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Flipradar</h1>
  <div class="mtog" role="group" aria-label="Marked"><button class="btn" data-m="kbh">København</button><button class="btn" data-m="ns">Nordsjælland</button></div>
  <span class="count" id="count"></span>
  <span class="sp"></span>
  <div class="viewtog"><button class="btn on" data-view="list">Liste</button><button class="btn" data-view="map">Kort</button></div>
  <button class="btn" id="openSettings">Antagelser og områder</button>
</header>
<div class="note" id="note">Henter data ...</div>
<button type="button" class="newbar" id="newbar" hidden></button>
<form class="filters collapsed" id="filters" onsubmit="return false">
  <label class="keep">Søg<input id="q" placeholder="Vej, postnr. eller område"></label>
  <div class="msel"><span class="mlabel" id="dlabel">Bydel</span><button type="button" class="dd" id="dbtn" aria-haspopup="true" aria-expanded="false">Alle bydele</button><div class="mpanel" id="dpanel" hidden></div></div>
  <label>Boligtype<select id="t"><option value="">Alle</option><option>Ejerlejlighed</option><option value="hus">Rækkehus/villa</option></select></label>
  <label>Maks. pris<input id="max" type="number" step="100000" value="6000000"></label>
  <label>Min. m²<input id="min" type="number" step="5" value="0"></label>
  <label class="keep">Sortér efter<select id="sort">
    <option value="m2pris">m²-pris</option><option value="nyeste">Nyeste først</option><option value="pris">Totalpris</option><option value="m2">Størrelse (m²)</option>
    <option value="rabat">Rabat ift. området</option><option value="avance">Forventet avance</option>
    <option value="liggetid">Liggetid</option><option value="rank">Områderang</option></select></label>
  <button class="btn keep" id="dir" type="button" title="Skift retning">Lav → høj</button>
  <button class="btn keep" id="ftog" type="button" aria-expanded="false">Filtre</button>
  <label class="chk"><input type="checkbox" id="nye">Kun nye <span id="nyeN"></span></label>
  <label class="chk"><input type="checkbox" id="proj">Kun projektboliger</label>
  <label class="chk"><input type="checkbox" id="budget">Kun inden for budget</label>
  <label class="chk"><input type="checkbox" id="avok">Kun med min. avance</label>
  <label class="chk"><input type="checkbox" id="ude">Kun altan eller terrasse</label>
  <label class="chk"><input type="checkbox" id="fav">Kun favoritter</label>
  <label class="chk"><input type="checkbox" id="hjem" checked>Skjul hjemfaldspligt</label>
  <label class="chk"><input type="checkbox" id="saer">Vis særlige boliger</label>
</form>
<main class="main" id="main">
  <section class="list" id="list" aria-label="Boliger"></section>
  <div id="map" aria-label="Kort over boliger"></div>
</main>
<aside class="drawer" id="drawer" aria-label="Boligdetaljer"></aside>
<dialog id="settings"></dialog>

<script>
/* Flipradar: læser data/listings.json, som dataindsamleren opdaterer */
let LISTINGS=[],ZONES=[],Z={},byId={},DISTRICTS=[],META={};
const HJEMFALD=/hjemfald/i;
const FLIPWORDS=/kærlig hånd|renoveringsbehov|renoveringskrævende|dødsbo|potentiale|istandsæt|oprindelig stand|projektbolig|håndværksmæssigt anlagt|som beset|trænger til/i;

/* ---------- Gemte data (pr. browser indtil synk er sat op) ---------- */
const DEF={budget:4500000,minAvance:250000,skoedePct:0.6,skoedeFast:1850,advokat:9500,letKoekken:130000,letMaling:1000,letGulv:10000,letElVvs:1000,letLoft:800,letNedbryd:10000,renoMellem:9000,renoTotal:16000,bufferPct:10,momsPct:25,mdr:5,rente:4.25,salgFast:75000,skatPct:22};
const SETTINGS_VER=3;
const URLP=new URLSearchParams(location.search);
let MARKET='kbh';try{MARKET=localStorage.getItem('flipradar.market')==='ns'?'ns':'kbh'}catch(e){}
if(URLP.get('m')==='ns'||URLP.get('m')==='kbh'){MARKET=URLP.get('m');try{localStorage.setItem('flipradar.market',MARKET)}catch(e){}}
const NS=MARKET==='ns';
const DEF_NS={...DEF,nsUdvendig:40000,nsRapport:18000};
const DEFM=NS?DEF_NS:DEF;
function renoPoster(l,level){const s=S.settings;if(level==='Let')return[['Nyt køkken inkl. installering',s.letKoekken],['Tapet, spartel, filt og maling ('+fmt(s.letMaling)+' kr/m²)',s.letMaling*l.m2],['Slibning og lak af gulv',s.letGulv],['El og VVS ('+fmt(s.letElVvs)+' kr/m²)',s.letElVvs*l.m2],['Nye lofter ('+fmt(s.letLoft)+' kr/m²)',s.letLoft*l.m2],['Nedbrydning og bortskaffelse'+(S.meta[l.id]?.nedbryd!=null?' (rettet for denne bolig)':''),S.meta[l.id]?.nedbryd??s.letNedbryd]].concat(s.nsUdvendig!=null?[['Udvendig maling og træbeskyttelse',s.nsUdvendig]]:[]);
 return[[level+' renovering ('+fmt(s['reno'+level])+' kr/m², foreløbigt skøn)',s['reno'+level]*l.m2]]}
const renoSumEx=(l,level)=>renoPoster(l,level).reduce((a,[,v])=>a+v,0);
const momsF=()=>1+(S.settings.momsPct||0)/100;
const renoSum=(l,level)=>renoSumEx(l,level)*momsF();
const LS='flipradar.v1';
let S={favs:{},meta:{},rank:{},snap:{},hjemf:{},first:{},settings:{...DEF}};
const erHjemfald=l=>l.hjemfald||!!S.hjemf[l.id];
try{const s=JSON.parse(localStorage.getItem(LS));if(s)S={...S,...s,snap:s.snap||{},hjemf:s.hjemf||{},first:s.first||{},settings:{...DEF,...(s.settings||{})}};if(S.sv!==SETTINGS_VER){S.settings={...DEF};S.sv=SETTINGS_VER}if(!S.mv){Object.values(S.meta||{}).forEach(m=>m.level='Let');S.mv=1}}catch(e){}
if(NS){S._kbh=S.settings;S.settings={...DEF_NS,...(S.settingsNS||{})}}
function save(){const o={...S};if(NS){o.settingsNS=S.settings;o.settings=S._kbh;delete o._kbh}try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
const meta=id=>S.meta[id]||(S.meta[id]={level:'Let',status:'Ny',note:''});
const zoneRank=z=>z?(S.rank[z.id]||z.autoRank||null):null;
const rankTxt=z=>zoneRank(z)??'–';
const NOW=Date.now(),NYT_TIMER=24;
const FIRST=S.first[MARKET]||(S.first[MARKET]={});
const isNy=l=>FIRST[l.id]>0&&(NOW-FIRST[l.id])/36e5<NYT_TIMER;
const prisfald=l=>{const sn=S.snap[l.id];return S.favs[l.id]&&sn&&sn.pris&&l.pris<sn.pris?sn.pris-l.pris:0};
const faldNy=l=>{const sn=S.snap[l.id];return prisfald(l)>0&&l.pris<(sn.ack??sn.pris)};
const erNy=l=>isNy(l)||faldNy(l);
const TJEK=0.4; /* mere end 40 % under markedet: tjek prisen */
const tjek=l=>l.rabat!=null&&l.rabat>TJEK;

/* ---------- Hjælpere ---------- */
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('da-DK'),kr=n=>fmt(n)+' kr';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorFor=r=>r==null?'var(--neutral)':r>=.15?'var(--good)':r>=.05?'var(--ok)':r>-.05?'var(--neutral)':'var(--bad)';
const avHex=l=>{const a=calc(l).avance;return a==null?'#A3ADB2':a>=S.settings.minAvance?'#2E8B57':a>=0?'#E0A800':'#C2493D'};
const hexFor=r=>r==null?'#A3ADB2':r>=.15?'#2E8B57':r>=.05?'#8DB36B':r>-.05?'#A3ADB2':'#C2493D';
const datoTxt=s=>new Date(s).toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});

/* ---------- Beregning ---------- */
function calc(l,level){const s=S.settings,mk=l.marked||{};level=level||(S.meta[l.id]?.level)||'Let';
 const salgM2=mk.naer5Snit||mk.niveau||null;
 const r=s.rente/100/12*s.mdr,renoEx=renoSumEx(l,level),renoKr=renoSum(l,level),renoMoms=renoKr-renoEx,buffer=renoKr*s.bufferPct/100;
 const skoede=s.skoedeFast+l.pris*s.skoedePct/100,koebOmk=skoede+s.advokat;
 const kapital=l.pris+koebOmk+renoKr+buffer,renter=kapital*r,ejer=l.ejerudgift*s.mdr,hold=renter+ejer;
 const kontant=kapital+hold,budgetOK=kontant<=s.budget;
 const base={renoKr,renoEx,renoMoms,buffer,skoede,koebOmk,renter,ejer,hold,kontant,budgetOK};
 if(!salgM2)return{...base,salg:null,avance:null,maxPris:null};
 const salg=l.m2*salgM2,salgOmk=s.salgFast+(s.nsRapport||0),avance=salg-salgOmk-kontant;
 const k=(1+s.skoedePct/100)*(1+r),fast=(s.skoedeFast+s.advokat+renoKr+buffer)*(1+r)+ejer;
 const maxPris=Math.min((salg-salgOmk-fast-s.minAvance)/k,(s.budget-fast)/k);
 return{...base,salg,salgM2,salgBasis:mk.naer5Snit?'naer5':'niveau',salgOmk,avance,maxPris}}

function gauge(r){if(r==null)return '<span class="gauge small">Ingen markedsdata</span>';
 const p=Math.max(-.3,Math.min(.3,r)),w=Math.abs(p)/.3*50,st=p>=0?`left:50%;width:${w}%`:`right:50%;width:${w}%`;
 return `<span class="gauge" title="m²-pris sammenlignet med markedsniveauet"><span class="gbar"><span class="gfill" style="${st};background:${colorFor(r)}"></span></span>${r>=0?fmt(r*100)+' % under':fmt(-r*100)+' % over'} marked</span>`}
function tags(l,c){const t=[],mk=l.marked||{};
 if(isNy(l))t.push('<span class="tag new">Ny</span>');
 if(prisfald(l))t.push(`<span class="tag fald">${faldNy(l)?'Nyt prisfald: ':''}sat ned ${kr(prisfald(l))} siden du gemte den</span>`);
 if(l.saerlig)t.push(`<span class="tag warn">Særlige vilkår: ${esc(l.saerlig)}</span>`);
 if(tjek(l))t.push('<span class="tag warn">Tjek prisen</span>');

 max=+$('max').value||Infinity,min=+$('min').value||0,proj=$('proj').checked,bud=$('budget').checked,fav=$('fav').checked,ude=$('ude').checked,saer=$('saer').checked,hjem=$('hjem').checked,avok=$('avok').checked;
 const arr=LISTINGS.filter(l=>(!nye||erNy(l))&&(!SELD.size||SELD.has(l.distrikt))&&(!t||(t==='hus'?l.type!=='Ejerlejlighed':l.type===t))&&l.pris<=max&&l.m2>=min
  &&(!proj||l.flag)&&(!fav||S.favs[l.id])&&(!ude||l.altan||l.terrasse)&&(saer||!l.saerlig)&&(!hjem||!erHjemfald(l))&&(!bud||calc(l).budgetOK)&&(!avok||(calc(l).avance??-1)>=S.settings.minAvance)
  &&(!q||(l.adresse+' '+l.postnr+' '+l.by+' '+l.distrikt+' '+(Z[l.zone]?.n||'')).toLowerCase().includes(q)));
 const key={nyeste:l=>(erNy(l)?-1e6:0)+l.liggetid,m2pris:l=>l.m2pris,pris:l=>l.pris,m2:l=>l.m2,rabat:l=>l.rabat,avance:l=>calc(l).avance,liggetid:l=>l.liggetid,rank:l=>zoneRank(Z[l.zone])}[$('sort').value];
 return arr.sort((a,b)=>{const ta=tjek(a)||!!a.saerlig,tb=tjek(b)||!!b.saerlig;if(ta!==tb)return ta?1:-1;const x=key(a),y=key(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(x-y)*dir})}

$('drawer').addEventListener('change',e=>{if(e.target.matches('[data-status]')){meta(sel).status=e.target.value;save();render()}
 if(e.target.matches('[data-nedb]')){const v=parseFloat(e.target.value);const mm=meta(sel);if(isNaN(v)||v===S.settings.letNedbryd)delete mm.nedbryd;else mm.nedbryd=Math.max(0,v);save();openDrawer(sel,true);render()}});
$('drawer').addEventListener('input',e=>{if(e.target.matches('[data-note]')){meta(sel).note=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('open'))closeDrawer()});

/* ---------- Antagelser og områderang ---------- */
const FIELDS=[['budget','Låneramme / budget (kr)'],['minAvance','Mindste avance (kr)'],['skoedeFast','Tinglysning skøde, fast (kr)'],['skoedePct','Tinglysning skøde (% af pris)'],['advokat','Advokat ved køb (kr)'],
 ['letKoekken','Let: nyt køkken inkl. installering (kr ekskl. moms)'],['letMaling','Let: tapet, spartel, filt, maling (kr/m² ekskl. moms)'],['letGulv','Let: slibning og lak af gulv (kr ekskl. moms)'],['letElVvs','Let: el og VVS (kr/m² ekskl. moms)'],['letLoft','Let: nye lofter (kr/m² ekskl. moms)'],['letNedbryd','Let: nedbrydning, standard (kr ekskl. moms)'],
 ['renoMellem','Mellem renovering (kr/m², foreløbigt skøn)'],['renoTotal','Totalrenovering (kr/m², foreløbigt skøn)'],['bufferPct','Buffer til uforudsete udgifter (% af renovering inkl. moms)'],['momsPct','Moms på renovering (%)'],['mdr','Projektets varighed (mdr.)'],
 ['rente','Rente på finansiering (% p.a.)'],['salgFast','Salgsomkostninger, mægler m.m. (kr)']].concat(NS?[['nsUdvendig','Sommerhus: udvendig maling og træbeskyttelse (kr ekskl. moms, Claudes skøn)'],['nsRapport','Sommerhus: tilstands- og elrapport ved salg (kr, Claudes skøn)']]:[]);
$('openSettings').addEventListener('click',()=>{const s=S.settings,dlg=$('settings');
 dlg.innerHTML=`<h2>Antagelser</h2><p class="small">Bruges i flip-beregningen for alle boliger.</p>
 <div class="grid2">${FIELDS.map(([k,t])=>`<label>${t}<input type="number" step="any" data-k="${k}" value="${s[k]}"></label>`).join('')}</div>
 <h3>Områdernes rang</h3><p class="small">1 er det mest attraktive i bydelen, 10 det mindst attraktive. Forslaget er beregnet ud fra medianen af frie handler af lejligheder de seneste ${META.regler?.dage||120} dage. Skriv dit eget tal for at overskrive det.</p>
 ${DISTRICTS.map(d=>`<h3>${d}</h3>`+ZONES.filter(z=>z.d===d).sort((a,b)=>(zoneRank(a)??99)-(zoneRank(b)??99)).map(z=>`<div class="zrow"><span>${esc(z.n)} <span class="small">(${z.m2?fmt(z.m2)+' kr/m², '+z.antal+' handler':'ingen handler'}, ${z.autoRank?'forslag '+z.autoRank:'for få handler til et forslag'})</span></span><input type="number" min="1" max="10" data-z="${z.id}" value="${S.rank[z.id]||''}" placeholder="${z.autoRank??''}" aria-label="Rang for ${esc(z.n)}"></div>`).join('')).join('')}
 <p style="display:flex;gap:10px;justify-content:space-between;margin-top:18px"><button class="btn" data-reset>Nulstil antagelser</button><button class="btn" data-done style="background:var(--ink);color:#fff;border-color:var(--ink)">Gem og luk</button></p>`;
 dlg.showModal()});
$('settings').addEventListener('input',e=>{const k=e.target.dataset.k,z=e.target.dataset.z;
 if(k){const v=parseFloat(e.target.value);if(!isNaN(v))S.settings[k]=v}
 if(z){const v=parseInt(e.target.value);if(v>=1&&v<=10)S.rank[z]=v;else delete S.rank[z]}save()});
$('settings').addEventListener('click',e=>{
 if(e.target.closest('[data-reset]')){S.settings={...DEFM};save();$('settings').close();$('openSettings').click()}
 if(e.target.closest('[data-done]'))$('settings').close()});
$('settings').addEventListener('close',()=>{drawZones();render();if(sel&&$('drawer').classList.contains('open'))openDrawer(sel,true)});

/* ---------- Mobil: liste/kort ---------- */
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));
 $('main').classList.toggle('show-map',b.dataset.view==='map');setTimeout(()=>map.invalidateSize(),50)}));

/* ---------- Mobil: sammenklappelige filtre ---------- */
function aktiveFiltre(){let n=0;['proj','budget','avok','ude','fav','saer','nye'].forEach(i=>{if($(i).checked)n++});
 if(!NS&&!$('hjem').checked)n++;if(SELD.size)n++;if($('t').value)n++;if(+$('min').value>0)n++;if(+$('max').value!==6000000)n++;return n}
function updFtog(){const n=aktiveFiltre(),open=!$('filters').classList.contains('collapsed');$('ftog').textContent=(open?'Skjul filtre':'Filtre')+(n?` (${n})`:'');$('ftog').setAttribute('aria-expanded',String(open))}
$('ftog').addEventListener('click',()=>{$('filters').classList.toggle('collapsed');updFtog()});
$('newbar').addEventListener('click',()=>{$('nye').checked=!$('nye').checked;if($('nye').checked){$('sort').value='nyeste';dir=1;setDirLabel()}render();$('list').scrollTop=0});
(function(){let last=0,acc=0;const lst=$('list');lst.addEventListener('scroll',()=>{if(innerWidth>860)return;const y=lst.scrollTop,d=y-last;last=y;
 if(y<20){document.body.classList.remove('compact');acc=0;return}
 acc=(acc>0)===(d>0)?acc+d:d;
 if(acc>40&&!document.body.classList.contains('compact')){document.body.classList.add('compact');$('filters').classList.add('collapsed');updFtog();$('dpanel').hidden=true}
 if(acc<-40)document.body.classList.remove('compact')},{passive:true})})();

/* ---------- Områdevælger med flueben ---------- */
const AKEY='flipradar.areas.'+MARKET;let ALLD=[],SELD=new Set();try{SELD=new Set(JSON.parse(localStorage.getItem(AKEY))||[])}catch(e){}
const ALLTXT=()=>NS?'Alle byer':'Alle bydele';
function areaLabel(){const n=SELD.size;$('dbtn').textContent=!n?ALLTXT():n===1?[...SELD][0]:n+(NS?' byer valgt':' bydele valgt')}
function buildAreas(){$('dpanel').innerHTML='<div class="mact"><button type="button" class="btn" data-all>Vælg alle</button><button type="button" class="btn" data-none>Ryd</button></div>'+ALLD.map(x=>{const n=LISTINGS.filter(l=>l.distrikt===x).length;return `<label class="chk"><input type="checkbox" value="${esc(x)}" ${SELD.has(x)?'checked':''}>${esc(x)} <span class="small">(${n})</span></label>`}).join('');areaLabel()}
function saveAreas(){try{localStorage.setItem(AKEY,JSON.stringify([...SELD]))}catch(e){}areaLabel();render()}
$('dbtn').addEventListener('click',e=>{e.stopPropagation();const p=$('dpanel');p.hidden=!p.hidden;$('dbtn').setAttribute('aria-expanded',String(!p.hidden))});
$('dpanel').addEventListener('click',e=>{e.stopPropagation();if(e.target.closest('[data-all]')){SELD=new Set(ALLD);buildAreas();saveAreas()}if(e.target.closest('[data-none]')){SELD.clear();buildAreas();saveAreas()}});
$('dpanel').addEventListener('change',e=>{const c=e.target;if(c.type!=='checkbox')return;e.stopPropagation();if(c.checked)SELD.add(c.value);else SELD.delete(c.value);saveAreas()});
document.addEventListener('click',e=>{if(!e.target.closest('.msel')){$('dpanel').hidden=true;$('dbtn').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('dpanel').hidden=true});

/* ---------- Indlæs data ---------- */
function init(d){META=d;ZONES=d.zoner||[];Z=Object.fromEntries(ZONES.map(z=>[z.id,z]));
 LISTINGS=(d.boliger||[]).filter(l=>l.id&&l.lat&&l.lng);
 LISTINGS.forEach(l=>{const n=l.marked?.niveau;l.rabat=n?1-l.m2pris/n:null;l.flag=FLIPWORDS.test((l.titel||'')+' '+(l.beskrivelse||''));l.hjemfald=HJEMFALD.test((l.titel||'')+' '+(l.beskrivelse||''))});
 byId=Object.fromEntries(LISTINGS.map(l=>[l.id,l]));
 const forste=!Object.keys(FIRST).length;
 LISTINGS.forEach(l=>{if(!(l.id in FIRST))FIRST[l.id]=forste?1:NOW});
 Object.keys(FIRST).forEach(id=>{if(!byId[id])delete FIRST[id]});save();
 DISTRICTS=[...new Set(ZONES.map(z=>z.d))];
 ALLD=[...new Set(LISTINGS.map(l=>l.distrikt))].sort((a,b)=>a.localeCompare(b,'da'));
 [...SELD].forEach(x=>{if(!ALLD.includes(x))SELD.delete(x)});buildAreas();
 const t=new Date(d.opdateret),timer=(Date.now()-t)/36e5;
 $('note').textContent=`Opdateret ${t.toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}: ${LISTINGS.length} boliger til salg og ${fmt(d.antalHandler||0)} frie handler fra de seneste ${d.regler?.dage||120} dage.`+(timer>12?' Dataene er over 12 timer gamle, så tjek at den automatiske opdatering kører på GitHub.':'');
 $('note').classList.toggle('ok',timer<=12);
 drawZones();render();
 const b=URLP.get('b');if(b){if(byId[b])openDrawer(b);else toast('Boligen er ikke længere til salg')}}
(function(){const d=document.createElement('div');d.className='legend';d.innerHTML='<div><i style="background:#2E8B57"></i>Min. avance</div><div><i style="background:#E0A800"></i>Under mål</div><div><i style="background:#C2493D"></i>Underskud</div><div><i class="ring"></i>Ny eller prisfald</div>';$('map').appendChild(d)})();
document.querySelectorAll('[data-m]').forEach(b=>{b.classList.toggle('on',b.dataset.m===MARKET);b.addEventListener('click',()=>{if(b.dataset.m===MARKET)return;try{localStorage.setItem('flipradar.market',b.dataset.m)}catch(e){}location.reload()})});
if(NS){$('t').closest('label').style.display='none';$('dlabel').textContent='By';$('hjem').closest('label').style.display='none';$('hjem').checked=false}
fetch(NS?'data/nordsjaelland.json':'data/listings.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init)
 .catch(()=>{$('note').textContent='Der er ingen boligdata endnu. Start "Opdater boligdata" under Actions på GitHub, og genindlæs siden, når den er færdig.';
  $('list').innerHTML='<div class="empty">Listen fyldes ud, når den første dataindsamling har kørt.</div>'});
</script>
</body>
</html>
