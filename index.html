<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipradar – boliger til salg i København</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--ink:#18232B;--muted:#5D6B73;--paper:#F5F7F6;--panel:#FFFFFF;--line:#DCE3E1;--patina:#3F7F6E;--patina-soft:#E3EFEB;--good:#2E8B57;--ok:#8DB36B;--neutral:#A3ADB2;--bad:#C2493D;--heart:#C2493D;
font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);font-size:15px;line-height:1.45;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.count{color:#B9C6C2;font-size:14px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer}
.top .btn{background:transparent;color:#fff;border-color:#3A4A54}
.top .btn.on{background:#fff;color:var(--ink)}
.note{background:#FFF6D9;border-bottom:1px solid #EADBA8;padding:6px 20px;font-size:13px;color:#5B4A12}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);align-items:end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
.filters input[type=number]{width:120px}
.filters .chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink);padding-bottom:7px}
.main{flex:1;display:grid;grid-template-columns:minmax(380px,540px) 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--line)}
#map{height:100%;min-height:300px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;padding:12px 16px 12px 10px;border-bottom:1px solid var(--line);background:var(--panel);cursor:pointer}
.row:hover{background:#FAFCFB}
.row.sel{box-shadow:inset 3px 0 0 var(--patina)}
.heart{border:0;background:none;font-size:21px;line-height:1;cursor:pointer;color:var(--neutral);padding:2px;align-self:start}
.heart.on{color:var(--heart)}
.addr{font-weight:650}
.price{font-weight:700;text-align:right;white-space:nowrap}
.sub,.nums,.tags{grid-column:2/4}
.sub{color:var(--muted);font-size:13px}
.nums{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--patina-soft);color:#24574A}
.tag.warn{background:#FCEBE8;color:#8E2F25}
.tag.plain{background:#EEF1F2;color:var(--muted)}
.gauge{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.gbar{position:relative;width:90px;height:8px;background:#EDF1F0;border-radius:4px}
.gbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.gfill{position:absolute;top:0;bottom:0;border-radius:4px}
.rank{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:0 6px;margin:0 4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);box-shadow:-8px 0 30px rgba(24,35,43,.18);transform:translateX(105%);transition:transform .22s;z-index:1000;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:start}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 16px;font-size:14px;margin:14px 0}
.facts dt{color:var(--muted);font-size:12px}
.facts dd{margin:0 0 6px;font-weight:600}
h2{font-stretch:112%;font-size:20px;margin:0 0 2px}
h3{font-size:15px;margin:22px 0 8px}
.calc{border:1px solid var(--line);border-radius:8px;padding:12px}
.calc table{width:100%;border-collapse:collapse;font-size:14px}
.calc td{padding:3px 0}
.calc td:last-child{text-align:right}
.calc tr.tot td{border-top:1px solid var(--line);font-weight:700;padding-top:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:#fff;padding:6px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.big{font-size:28px;font-weight:800;font-stretch:115%;margin:8px 0 2px}
.good{color:var(--good)}.bad{color:var(--bad)}
.small{font-size:13px;color:var(--muted)}
textarea,.drawer select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}
textarea{min-height:90px;margin-top:8px}
dialog{border:0;border-radius:10px;max-width:660px;width:calc(100% - 24px);padding:20px;max-height:85vh}
dialog::backdrop{background:rgba(24,35,43,.45)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.grid2 input{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.zrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:14px;border-bottom:1px solid #EEF2F1}
.zrow input{width:60px;border:1px solid var(--line);border-radius:6px;padding:4px}
.viewtog{display:none;gap:6px}
.empty{padding:24px 20px;color:var(--muted)}
.mk-heart{color:var(--heart);font-size:22px;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff}
.zlabel{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;font:700 11px/1.6 "Archivo",sans-serif;padding:0 6px;white-space:nowrap;opacity:.85}
.note.ok{background:var(--patina-soft);border-color:#C9DED7;color:#24574A}
.photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;margin:12px 0 4px;background:#EEF1F2}
.comps{width:100%;border-collapse:collapse;font-size:13px}
.comps th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.comps td{padding:4px 6px 4px 0;border-bottom:1px solid #EEF2F1}
.comps td.r,.comps th.r{text-align:right}
.wrapx{overflow-x:auto}
.mkt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.mkt div{background:#F5F7F6;border-radius:6px;padding:8px}
.mkt b{display:block;font-size:16px}
.mkt span{font-size:12px;color:var(--muted)}
.gone{opacity:.6}
@media (max-width:860px){
 .main{grid-template-columns:1fr}.viewtog{display:flex}
 .main.show-map .list{display:none}.main:not(.show-map) #map{display:none}
 .facts{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Flipradar</h1>
  <span class="count" id="count"></span>
  <span class="sp"></span>
  <div class="viewtog"><button class="btn on" data-view="list">Liste</button><button class="btn" data-view="map">Kort</button></div>
  <button class="btn" id="openSettings">Antagelser og områder</button>
</header>
<div class="note" id="note">Henter data ...</div>
<form class="filters" id="filters" onsubmit="return false">
  <label>Søg<input id="q" placeholder="Vej, postnr. eller område"></label>
  <label>Bydel<select id="d"><option value="">Alle bydele</option></select></label>
  <label>Boligtype<select id="t"><option value="">Alle</option><option>Ejerlejlighed</option><option value="hus">Rækkehus/villa</option></select></label>
  <label>Maks. pris<input id="max" type="number" step="100000" value="4500000"></label>
  <label>Min. m²<input id="min" type="number" step="5" value="0"></label>
  <label>Sortér efter<select id="sort">
    <option value="m2pris">m²-pris</option><option value="pris">Totalpris</option><option value="m2">Størrelse (m²)</option>
    <option value="rabat">Rabat ift. området</option><option value="avance">Forventet avance</option>
    <option value="liggetid">Liggetid</option><option value="rank">Områderang</option></select></label>
  <button class="btn" id="dir" type="button" title="Skift retning">Lav → høj</button>
  <label class="chk"><input type="checkbox" id="proj">Kun projektboliger</label>
  <label class="chk"><input type="checkbox" id="budget">Kun inden for budget</label>
  <label class="chk"><input type="checkbox" id="ude">Kun altan eller terrasse</label>
  <label class="chk"><input type="checkbox" id="fav">Kun favoritter</label>
  <label class="chk"><input type="checkbox" id="hjem" checked>Skjul hjemfaldspligt</label>
  <label class="chk"><input type="checkbox" id="saer">Vis særlige boliger</label>
</form>
<main class="main" id="main">
  <section class="list" id="list" aria-label="Boliger"></section>
  <div id="map" aria-label="Kort over boliger"></div>
</main>
<aside class="drawer" id="drawer" aria-label="Boligdetaljer"></aside>
<dialog id="settings"></dialog>

<script>
/* Flipradar: læser data/listings.json, som dataindsamleren opdaterer */
let LISTINGS=[],ZONES=[],Z={},byId={},DISTRICTS=[],META={};
const HJEMFALD=/hjemfald/i;
const FLIPWORDS=/kærlig hånd|renoveringsbehov|renoveringskrævende|dødsbo|potentiale|istandsæt|oprindelig stand|projektbolig|håndværksmæssigt anlagt|som beset|trænger til/i;

/* ---------- Gemte data (pr. browser indtil synk er sat op) ---------- */
const DEF={budget:5000000,minAvance:250000,koebPct:1.0,koebFast:25000,renoLet:4000,renoMellem:9000,renoTotal:16000,mdr:5,rente:5,maeglerPct:1.5,salgFast:40000,istandFaktor:1.05};
const LS='flipradar.v1';
let S={favs:{},meta:{},rank:{},snap:{},settings:{...DEF}};
try{const s=JSON.parse(localStorage.getItem(LS));if(s)S={...S,...s,snap:s.snap||{},settings:{...DEF,...(s.settings||{})}}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const meta=id=>S.meta[id]||(S.meta[id]={level:'Mellem',status:'Ny',note:''});
const zoneRank=z=>z?(S.rank[z.id]||z.autoRank||null):null;
const rankTxt=z=>zoneRank(z)??'–';
const TJEK=0.4; /* mere end 40 % under markedet: tjek prisen */
const tjek=l=>l.rabat!=null&&l.rabat>TJEK;

/* ---------- Hjælpere ---------- */
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('da-DK'),kr=n=>fmt(n)+' kr';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorFor=r=>r==null?'var(--neutral)':r>=.15?'var(--good)':r>=.05?'var(--ok)':r>-.05?'var(--neutral)':'var(--bad)';
const hexFor=r=>r==null?'#A3ADB2':r>=.15?'#2E8B57':r>=.05?'#8DB36B':r>-.05?'#A3ADB2':'#C2493D';
const datoTxt=s=>new Date(s).toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});

/* ---------- Beregning ---------- */
function calc(l,level){const s=S.settings,mk=l.marked||{};level=level||(S.meta[l.id]?.level)||'Mellem';
 const salgM2=mk.salgP75||(mk.niveau?mk.niveau*s.istandFaktor:null);
 const renoKr=l.m2*s['reno'+level],koebOmk=l.pris*s.koebPct/100+s.koebFast,hold=l.pris*s.rente/100/12*s.mdr+l.ejerudgift*s.mdr;
 const kontant=l.pris+koebOmk+renoKr+hold,budgetOK=kontant<=s.budget;
 if(!salgM2)return{renoKr,koebOmk,hold,kontant,budgetOK,salg:null,avance:null,maxPris:null};
 const salg=l.m2*salgM2,salgOmk=salg*s.maeglerPct/100+s.salgFast,avance=salg-salgOmk-kontant;
 const k=1+s.koebPct/100+s.rente/100/12*s.mdr,fast=s.koebFast+renoKr+l.ejerudgift*s.mdr;
 const maxPris=Math.min((salg-salgOmk-fast-s.minAvance)/k,(s.budget-fast)/k);
 return{renoKr,salg,salgM2,salgBasis:mk.salgP75?'p75':'niveau',salgOmk,koebOmk,hold,kontant,avance,maxPris,budgetOK}}

function gauge(r){if(r==null)return '<span class="gauge small">Ingen markedsdata</span>';
 const p=Math.max(-.3,Math.min(.3,r)),w=Math.abs(p)/.3*50,st=p>=0?`left:50%;width:${w}%`:`right:50%;width:${w}%`;
 return `<span class="gauge" title="m²-pris sammenlignet med markedsniveauet"><span class="gbar"><span class="gfill" style="${st};background:${colorFor(r)}"></span></span>${r>=0?fmt(r*100)+' % under':fmt(-r*100)+' % over'} marked</span>`}
function tags(l,c){const t=[],mk=l.marked||{};
 if(l.saerlig)t.push(`<span class="tag warn">Særlige vilkår: ${esc(l.saerlig)}</span>`);
 if(tjek(l))t.push('<span class="tag warn">Tjek prisen</span>');
 if(l.hjemfald)t.push('<span class="tag warn">Hjemfaldspligt</span>');
 if(l.flag)t.push('<span class="tag">Projektbolig</span>');
 if(l.prisaendring<0)t.push(`<span class="tag">Sat ned ${fmt(-l.prisaendring)} %</span>`);
 if(l.liggetid>90)t.push(`<span class="tag plain">${l.liggetid} dage til salg</span>`);
 if(c.avance!=null&&c.avance>=S.settings.minAvance)t.push(`<span class="tag">Avance ca. ${kr(c.avance)}</span>`);
 if(!c.budgetOK)t.push('<span class="tag warn">Over budget</span>');
 if(l.asbest)t.push('<span class="tag warn">Asbest i tag</span>');
 if(mk.niveau&&!mk.solid)t.push('<span class="tag plain">Få handler</span>');
 if(l.altan||l.terrasse)t.push(`<span class="tag plain">${l.altan?'Altan':'Terrasse'}</span>`);
 const st=S.meta[l.id]?.status;if(S.favs[l.id]&&st&&st!=='Ny')t.push(`<span class="tag plain">${esc(st)}</span>`);
 return t.join('')}

/* ---------- Filtre ---------- */
const DEFDIR={m2pris:1,pris:1,m2:-1,rabat:-1,avance:-1,liggetid:-1,rank:1};
let dir=1,sel=null;
function setDirLabel(){$('dir').textContent=dir===1?'Lav → høj':'Høj → lav'}
$('sort').addEventListener('change',()=>{dir=DEFDIR[$('sort').value];setDirLabel();render()});
$('dir').addEventListener('click',()=>{dir*=-1;setDirLabel();render()});
$('filters').addEventListener('input',e=>{if(e.target.id!=='sort')render()});
function filtered(){const q=$('q').value.trim().toLowerCase(),d=$('d').value,t=$('t').value,
 max=+$('max').value||Infinity,min=+$('min').value||0,proj=$('proj').checked,bud=$('budget').checked,fav=$('fav').checked,ude=$('ude').checked,saer=$('saer').checked,hjem=$('hjem').checked;
 const arr=LISTINGS.filter(l=>(!d||l.distrikt===d)&&(!t||(t==='hus'?l.type!=='Ejerlejlighed':l.type===t))&&l.pris<=max&&l.m2>=min
  &&(!proj||l.flag)&&(!fav||S.favs[l.id])&&(!ude||l.altan||l.terrasse)&&(saer||!l.saerlig)&&(!hjem||!l.hjemfald)&&(!bud||calc(l).budgetOK)
  &&(!q||(l.adresse+' '+l.postnr+' '+l.by+' '+l.distrikt+' '+(Z[l.zone]?.n||'')).toLowerCase().includes(q)));
 const key={m2pris:l=>l.m2pris,pris:l=>l.pris,m2:l=>l.m2,rabat:l=>l.rabat,avance:l=>calc(l).avance,liggetid:l=>l.liggetid,rank:l=>zoneRank(Z[l.zone])}[$('sort').value];
 return arr.sort((a,b)=>{const ta=tjek(a)||!!a.saerlig,tb=tjek(b)||!!b.saerlig;if(ta!==tb)return ta?1:-1;const x=key(a),y=key(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(x-y)*dir})}

/* ---------- Kort ---------- */
const map=L.map('map').setView([55.684,12.545],12);
const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Kort &copy; Esri'});
const esriGray=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Kort &copy; Esri'});
const esriFoto=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Luftfoto &copy; Esri'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap-bidragydere'});
esri.addTo(map);
const zoneLayer=L.layerGroup().addTo(map),markers=L.layerGroup().addTo(map);
function drawZones(){zoneLayer.clearLayers();const full=map.getZoom()>=14;ZONES.forEach(z=>{
 L.circle([z.lat,z.lng],{radius:520,color:'#3F7F6E',weight:1,fillOpacity:.06,interactive:false}).addTo(zoneLayer);
 L.marker([z.lat,z.lng],{interactive:false,icon:L.divIcon({className:'',iconSize:null,html:`<span class="zlabel">${rankTxt(z)}${full?' '+esc(z.n)+(z.m2?', '+fmt(z.m2)+' kr/m²':''):''}</span>`})}).addTo(zoneLayer)})}
map.on('zoomend',drawZones);
L.control.layers({'Gadekort':esri,'Lyst kort':esriGray,'Luftfoto':esriFoto,'OpenStreetMap':osm},{'Områder og rang':zoneLayer}).addTo(map);
function drawMarkers(arr){markers.clearLayers();arr.forEach(l=>{
 const m=S.favs[l.id]?L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<span class="mk-heart">♥</span>'})})
  :L.circleMarker([l.lat,l.lng],{radius:l.id===sel?10:7,color:'#fff',weight:2,fillColor:hexFor(l.rabat),fillOpacity:.95});
 m.bindTooltip(`${esc(l.adresse)}<br>${kr(l.pris)}, ${l.m2} m², ${fmt(l.m2pris)} kr/m²`);
 m.on('click',()=>openDrawer(l.id));m.addTo(markers)})}

/* ---------- Liste ---------- */
function rowHTML(l){const z=Z[l.zone],c=calc(l),f=!!S.favs[l.id];
 return `<div class="row${sel===l.id?' sel':''}" data-id="${esc(l.id)}" tabindex="0">
 <button class="heart${f?' on':''}" data-heart="${esc(l.id)}" aria-label="${f?'Fjern fra favoritter':'Gem som favorit'}">${f?'♥':'♡'}</button>
 <div class="addr">${esc(l.adresse)}</div><div class="price">${kr(l.pris)}</div>
 <div class="sub">${l.postnr} ${esc(l.by)}${z?', '+esc(z.n)+`<span class="rank" title="Områdets rang i ${esc(l.distrikt)} (1 er bedst)">${rankTxt(z)}</span>`:' '}${l.type}</div>
 <div class="nums"><span><b>${l.m2}</b> m²</span><span><b>${fmt(l.m2pris)}</b> kr/m²</span>${gauge(l.rabat)}</div>
 <div class="tags">${tags(l,c)}</div></div>`}
function goneHTML(){const gone=Object.keys(S.favs).filter(id=>!byId[id]);if(!gone.length)return '';
 return `<div class="empty"><b>Ikke længere til salg</b>${gone.map(id=>{const s=S.snap[id]||{};
  return `<div class="zrow gone"><span>${esc(s.adresse||'Ukendt adresse')}${s.pris?', '+kr(s.pris):''}${S.meta[id]?.note?'<br><span class="small">'+esc(S.meta[id].note)+'</span>':''}</span><button class="btn" data-forget="${esc(id)}">Fjern</button></div>`}).join('')}</div>`}
function render(){const arr=filtered();
 $('count').textContent=`${arr.length} af ${LISTINGS.length} boliger, ${Object.keys(S.favs).length} favoritter`;
 $('list').innerHTML=(arr.length?arr.map(rowHTML).join(''):'<div class="empty">Ingen boliger matcher filtrene. Prøv at hæve maks. prisen eller vælge alle bydele.</div>')+($('fav').checked?goneHTML():'');
 drawMarkers(arr)}
function toggleFav(id){if(S.favs[id])delete S.favs[id];else{S.favs[id]=true;meta(id);const l=byId[id];if(l)S.snap[id]={adresse:l.adresse,pris:l.pris,url:l.url}}save();render();if(sel===id)openDrawer(id,true)}
$('list').addEventListener('click',e=>{const h=e.target.closest('[data-heart]');if(h){e.stopPropagation();toggleFav(h.dataset.heart);return}
 const g=e.target.closest('[data-forget]');if(g){delete S.favs[g.dataset.forget];save();render();return}
 const r=e.target.closest('.row');if(r)openDrawer(r.dataset.id)});
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))openDrawer(e.target.dataset.id)});

/* ---------- Detaljer ---------- */
function marketHTML(l){const mk=l.marked||{};
 if(!mk.niveau)return '<p class="small">Der er ikke fundet sammenlignelige handler eller annoncer i nærheden.</p>';
 const pctSalg=mk.vaegtSalg!=null?Math.round(mk.vaegtSalg*100):100;
 return `<div class="mkt">
 <div><span>Frie handler</span><b>${mk.salgMedian?fmt(mk.salgMedian):'–'}</b><span>${mk.salgAntal} handler, ${mk.dage} dage, ${fmt(mk.radius)} m</span></div>
 <div><span>Aktuelle annoncer</span><b>${mk.udbudMedian?fmt(mk.udbudMedian):'–'}</b><span>${mk.udbudAntal} annoncer, justeret ${String(mk.afslag).replace('.',',')} %</span></div>
 <div><span>Markedsniveau</span><b>${fmt(mk.niveau)}</b><span>${pctSalg} % fra handler</span></div></div>
 <p class="small">Alle tal er kr/m². Kun almindelige frie handler af ${l.gruppe==='lejl'?'lejligheder':'huse'} i lignende størrelse indgår. Familiehandler og tvangsauktioner er sorteret fra. Udbudspriserne er justeret med det typiske afslag i området.</p>
 ${mk.solid?'':`<p class="small bad">Under ${META.regler?.minHandler||8} handler fra de seneste ${META.regler?.dage||120} dage tæt på. Området eller perioden er udvidet, så tallet er mindre sikkert.</p>`}
 ${mk.handler?.length?`<div class="wrapx"><table class="comps"><thead><tr><th>Handel</th><th>Dato</th><th class="r">m²</th><th class="r">kr/m²</th><th class="r">Afstand</th></tr></thead><tbody>
 ${mk.handler.map(h=>`<tr><td>${esc(h.a)}</td><td>${datoTxt(h.d)}</td><td class="r">${h.m2}</td><td class="r">${fmt(h.kvm)}</td><td class="r">${fmt(h.afst)} m</td></tr>`).join('')}</tbody></table></div>`:''}`}
function openDrawer(id,keep){const l=byId[id];if(!l)return;const z=Z[l.zone],m=S.meta[id]||{level:'Mellem',status:'Ny',note:''},c=calc(l,m.level),s=S.settings,f=!!S.favs[id];
 sel=id;const dr=$('drawer');
 dr.innerHTML=`<div class="dhead"><div><h2>${esc(l.adresse)}</h2><div class="small">${l.postnr} ${esc(l.by)}${z?`, ${esc(z.n)} (områderang ${rankTxt(z)} af 10)`:''}</div></div>
 <div><button class="heart${f?' on':''}" data-dheart aria-label="${f?'Fjern fra favoritter':'Gem som favorit'}">${f?'♥':'♡'}</button> <button class="btn" data-close>Luk</button></div></div>
 ${l.billede?`<img class="photo" src="${esc(l.billede)}" alt="" loading="lazy">`:''}
 <dl class="facts">
 <div><dt>Pris</dt><dd>${kr(l.pris)}</dd></div><div><dt>Størrelse</dt><dd>${l.m2} m²${l.vaer?', '+l.vaer+' vær.':''}</dd></div><div><dt>m²-pris</dt><dd>${fmt(l.m2pris)} kr</dd></div>
 <div><dt>Boligtype</dt><dd>${l.type}</dd></div><div><dt>Byggeår</dt><dd>${l.byggeaar||'–'}</dd></div><div><dt>Energimærke</dt><dd>${l.energi||'–'}</dd></div>
 <div><dt>Ejerudgift</dt><dd>${kr(l.ejerudgift)}/md</dd></div><div><dt>Liggetid</dt><dd>${l.liggetid} dage</dd></div><div><dt>Prisændring</dt><dd>${l.prisaendring?String(l.prisaendring).replace('.',',')+' %':'Ingen'}</dd></div>
 <div><dt>Altan/terrasse</dt><dd>${l.altan?'Altan':l.terrasse?'Terrasse':'Nej'}</dd></div><div><dt>Elevator</dt><dd>${l.elevator?'Ja':'Nej'}</dd></div><div><dt>Tag</dt><dd>${l.asbest?'<span class="bad">Asbest</span>':'–'}</dd></div></dl>
 <div>${gauge(l.rabat)}</div>
 ${l.saerlig?`<p class="bad">Annoncen nævner "${esc(l.saerlig)}". Boligen har sandsynligvis særlige vilkår og kan ikke sammenlignes direkte med almindelige frie salg. Læs annoncen grundigt.</p>`:''}
 ${!l.saerlig&&tjek(l)?'<p class="bad">Prisen ligger over 40 % under markedsniveauet. Det skyldes oftest særlige vilkår, som ikke fremgår af de første linjer i annoncen. Tjek annoncen, før du regner videre.</p>':''}
 ${l.titel?`<h3>${esc(l.titel)}</h3>`:''}<p>${esc(l.beskrivelse)}${l.beskrivelse.length>=480?' ...':''}</p>
 <p>${l.url?`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">Åbn annoncen</a>`:''} ${l.plantegning?`<a class="btn" href="${esc(l.plantegning)}" target="_blank" rel="noopener">Plantegning</a>`:''}</p>
 <h3>Markedsniveau</h3>${marketHTML(l)}
 ${l.tidligereSalg?.length?`<h3>Tidligere salg af boligen</h3><table class="comps"><tbody>${l.tidligereSalg.map(t=>`<tr><td>${datoTxt(t.dato)}</td><td class="r">${kr(t.pris)}</td></tr>`).join('')}</tbody></table>`:''}
 <h3>Flip-beregning</h3><div class="calc">
 <div class="seg" role="group" aria-label="Renoveringsniveau">${['Let','Mellem','Total'].map(v=>`<button data-level="${v}" class="${m.level===v?'on':''}">${v} (${fmt(s['reno'+v])} kr/m²)</button>`).join('')}</div>
 ${c.salg==null?'<p class="small">Der er ikke markedsdata nok til at regne en salgspris ud.</p>':`<table>
 <tr><td>Købspris</td><td>${kr(l.pris)}</td></tr>
 <tr><td>Købsomkostninger</td><td>${kr(c.koebOmk)}</td></tr>
 <tr><td>Renovering</td><td>${kr(c.renoKr)}</td></tr>
 <tr><td>Renter og ejerudgift i ${s.mdr} mdr.</td><td>${kr(c.hold)}</td></tr>
 <tr class="tot"><td>Samlet investering</td><td class="${c.budgetOK?'':'bad'}">${kr(c.kontant)}</td></tr>
 <tr><td>Forventet salgspris</td><td>${kr(c.salg)}</td></tr>
 <tr><td>Salgsomkostninger</td><td>−${kr(c.salgOmk)}</td></tr></table>
 <div class="big ${c.avance>=s.minAvance?'good':c.avance<0?'bad':''}">${c.avance<0?'−':''}${kr(Math.abs(c.avance))}</div>
 <div class="small">Forventet avance. Dit mål er mindst ${kr(s.minAvance)}, og budgettet er ${kr(s.budget)}.</div>
 <p><b>Max købspris: ${c.maxPris>0?kr(c.maxPris):'regnestykket holder ikke'}</b><br><span class="small">Den højeste pris, der stadig giver dit mindstemål i avance og holder dig inden for budgettet.</span></p>
 <p class="small">${c.salgBasis==='p75'?`Salgsprisen efter renovering er sat til ${fmt(c.salgM2)} kr/m², den øverste fjerdedel af de sammenlignelige handler, som skøn for en istandsat bolig.`:`Der er for få handler til at bruge den øverste fjerdedel, så salgsprisen er markedsniveauet × ${String(s.istandFaktor).replace('.',',')}.`}</p>`}</div>
 <h3>Mine noter</h3>
 <select data-status ${f?'':'disabled'}>${['Ny','Set','Fremvisning booket','Bud givet','Droppet'].map(v=>`<option ${m.status===v?'selected':''}>${v}</option>`).join('')}</select>
 <textarea data-note placeholder="${f?'Fx stand på tag, foreningens økonomi, idéer til planløsning':'Gem boligen som favorit for at skrive noter'}" ${f?'':'disabled'}>${esc(m.note)}</textarea>`;
 dr.classList.add('open');if(!keep){render();map.panTo([l.lat,l.lng])}}
function closeDrawer(){$('drawer').classList.remove('open');sel=null;render()}
$('drawer').addEventListener('click',e=>{
 if(e.target.closest('[data-close]')){closeDrawer();return}
 if(e.target.closest('[data-dheart]')){toggleFav(sel);return}
 const lv=e.target.closest('[data-level]');if(lv){meta(sel).level=lv.dataset.level;save();openDrawer(sel,true);render()}});
$('drawer').addEventListener('change',e=>{if(e.target.matches('[data-status]')){meta(sel).status=e.target.value;save();render()}});
$('drawer').addEventListener('input',e=>{if(e.target.matches('[data-note]')){meta(sel).note=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('open'))closeDrawer()});

/* ---------- Antagelser og områderang ---------- */
const FIELDS=[['budget','Samlet budget (kr)'],['minAvance','Mindste avance (kr)'],['koebPct','Købsomkostninger (% af pris)'],['koebFast','Faste købsomkostninger (kr)'],
 ['renoLet','Let renovering (kr/m²)'],['renoMellem','Mellem renovering (kr/m²)'],['renoTotal','Totalrenovering (kr/m²)'],['mdr','Projektets varighed (mdr.)'],
 ['rente','Rente på finansiering (% p.a.)'],['maeglerPct','Mæglersalær (% af salgspris)'],['salgFast','Faste salgsomkostninger (kr)'],['istandFaktor','Istandsat ift. markedsniveau, ved få handler (faktor)']];
$('openSettings').addEventListener('click',()=>{const s=S.settings,dlg=$('settings');
 dlg.innerHTML=`<h2>Antagelser</h2><p class="small">Bruges i flip-beregningen for alle boliger.</p>
 <div class="grid2">${FIELDS.map(([k,t])=>`<label>${t}<input type="number" step="any" data-k="${k}" value="${s[k]}"></label>`).join('')}</div>
 <h3>Områdernes rang</h3><p class="small">1 er det mest attraktive i bydelen, 10 det mindst attraktive. Forslaget er beregnet ud fra medianen af frie handler af lejligheder de seneste ${META.regler?.dage||120} dage. Skriv dit eget tal for at overskrive det.</p>
 ${DISTRICTS.map(d=>`<h3>${d}</h3>`+ZONES.filter(z=>z.d===d).sort((a,b)=>(zoneRank(a)??99)-(zoneRank(b)??99)).map(z=>`<div class="zrow"><span>${esc(z.n)} <span class="small">(${z.m2?fmt(z.m2)+' kr/m², '+z.antal+' handler':'ingen handler'}, ${z.autoRank?'forslag '+z.autoRank:'for få handler til et forslag'})</span></span><input type="number" min="1" max="10" data-z="${z.id}" value="${S.rank[z.id]||''}" placeholder="${z.autoRank??''}" aria-label="Rang for ${esc(z.n)}"></div>`).join('')).join('')}
 <p style="display:flex;gap:10px;justify-content:space-between;margin-top:18px"><button class="btn" data-reset>Nulstil antagelser</button><button class="btn" data-done style="background:var(--ink);color:#fff;border-color:var(--ink)">Gem og luk</button></p>`;
 dlg.showModal()});
$('settings').addEventListener('input',e=>{const k=e.target.dataset.k,z=e.target.dataset.z;
 if(k){const v=parseFloat(e.target.value);if(!isNaN(v))S.settings[k]=v}
 if(z){const v=parseInt(e.target.value);if(v>=1&&v<=10)S.rank[z]=v;else delete S.rank[z]}save()});
$('settings').addEventListener('click',e=>{
 if(e.target.closest('[data-reset]')){S.settings={...DEF};save();$('settings').close();$('openSettings').click()}
 if(e.target.closest('[data-done]'))$('settings').close()});
$('settings').addEventListener('close',()=>{drawZones();render();if(sel&&$('drawer').classList.contains('open'))openDrawer(sel,true)});

/* ---------- Mobil: liste/kort ---------- */
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));
 $('main').classList.toggle('show-map',b.dataset.view==='map');setTimeout(()=>map.invalidateSize(),50)}));

/* ---------- Indlæs data ---------- */
function init(d){META=d;ZONES=d.zoner||[];Z=Object.fromEntries(ZONES.map(z=>[z.id,z]));
 LISTINGS=(d.boliger||[]).filter(l=>l.id&&l.lat&&l.lng);
 LISTINGS.forEach(l=>{const n=l.marked?.niveau;l.rabat=n?1-l.m2pris/n:null;l.flag=FLIPWORDS.test((l.titel||'')+' '+(l.beskrivelse||''));l.hjemfald=HJEMFALD.test((l.titel||'')+' '+(l.beskrivelse||''))});
 byId=Object.fromEntries(LISTINGS.map(l=>[l.id,l]));
 DISTRICTS=[...new Set(ZONES.map(z=>z.d))];
 DISTRICTS.forEach(x=>$('d').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
 const t=new Date(d.opdateret),timer=(Date.now()-t)/36e5;
 $('note').textContent=`Opdateret ${t.toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}: ${LISTINGS.length} boliger til salg og ${fmt(d.antalHandler||0)} frie handler fra de seneste ${d.regler?.dage||120} dage.`+(timer>12?' Dataene er over 12 timer gamle, så tjek at den automatiske opdatering kører på GitHub.':'');
 $('note').classList.toggle('ok',timer<=12);
 drawZones();render()}
fetch('data/listings.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init)
 .catch(()=>{$('note').textContent='Der er ingen boligdata endnu. Start "Opdater boligdata" under Actions på GitHub, og genindlæs siden, når den er færdig.';
  $('list').innerHTML='<div class="empty">Listen fyldes ud, når den første dataindsamling har kørt.</div>'});
</script>
</body>
</html>
